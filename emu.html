<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#game{width:100%;height:100%}
/* EmulatorJS-eigene Oberfläche ausblenden – Steuerung kommt vom Gehäuse */
.ejs_virtualGamepad_parent,.ejs_menu_bar,.ejs_context_menu,.ejs_start_button,
.ejs_message,.ejs_popup_container{display:none!important}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
</style></head>
<body><div id="game"></div>
<script>
function pblog(m){ try{ const l=JSON.parse(localStorage.getItem('pb_log')||'[]'); const d=new Date();
  l.push(d.toTimeString().slice(0,8)+' '+m); while(l.length>60) l.shift(); localStorage.setItem('pb_log',JSON.stringify(l)); }catch(_){} }
const pl = m => pblog('[emu] '+m);
addEventListener('error', e => pl('FEHLER '+(e.message||e.type)+' '+(e.filename||'').split('/').pop()+':'+(e.lineno||'')), true);
addEventListener('unhandledrejection', e => pl('PROMISE '+(e.reason&&(e.reason.message||e.reason))));
const _ce = console.error; console.error = (...a) => { pl('console '+a.map(String).join(' ').slice(0,160)); _ce(...a); };
async function unzipFirst(buf){
  const v=new DataView(buf); let o=0;
  while(o+30<buf.byteLength && v.getUint32(o,true)===0x04034b50){
    const flag=v.getUint16(o+6,true), method=v.getUint16(o+8,true);
    let csize=v.getUint32(o+18,true); const nl=v.getUint16(o+26,true), el=v.getUint16(o+28,true);
    const name=new TextDecoder().decode(new Uint8Array(buf,o+30,nl)), start=o+30+nl+el;
    if(flag&8){ // Grösse steht erst im Zentralverzeichnis
      const u8=new Uint8Array(buf); for(let i=buf.byteLength-22;i>=0;i--) if(v.getUint32(i,true)===0x06054b50){
        let c=v.getUint32(i+16,true); while(v.getUint32(c,true)===0x02014b50){ const n2=v.getUint16(c+28,true);
          const nm=new TextDecoder().decode(u8.subarray(c+46,c+46+n2));
          if(nm===name){ csize=v.getUint32(c+20,true); break; } c+=46+n2+v.getUint16(c+30,true)+v.getUint16(c+32,true);} break; }
    }
    if(/\.(gba|gbc|gb)$/i.test(name)){
      const data=new Uint8Array(buf,start,csize);
      if(method===0) return {name,buf:data.slice().buffer};
      const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return {name,buf:await new Response(ds).arrayBuffer()};
    }
    o=start+csize;
  }
  return null;
}
function romKind(buf,name){
  const u=new Uint8Array(buf);
  if(/\.gbc$/i.test(name||'') && !(u.length>0xB2 && u[0xB2]===0x96 && u[3]===0xEA)) return 'gbc';  // .gbc-Endung zählt als Color
  if(u.length>0xB2 && u[0xB2]===0x96 && u[3]===0xEA) return 'gba';      // GBA-Header: feste Kennung + Sprungbefehl
  if(u.length>0x143 && (u[0x143]&0x80)) return 'gbc';                     // Color-Flag im GB-Header
  return 'dmg';
}
(async () => {
  const P = parent;
  let buf = await P.__rom.file.arrayBuffer(), name = P.__rom.name;
  const u0 = new Uint8Array(buf,0,2);
  if(u0[0]===0x50 && u0[1]===0x4B){ const z = await unzipFirst(buf); if(z){ buf=z.buf; name=z.name.split('/').pop(); } }
  const kind = romKind(buf,name);
  pl('ROM '+name+' '+Math.round(buf.byteLength/1024)+'KB typ='+kind);
  name = name.replace(/\.(zip|gb|gbc|gba)$/i,'') + (kind==='gba'?'.gba':kind==='gbc'?'.gbc':'.gb');
  const file = new File([buf], name);
  P.postMessage({ t:'kind', kind }, '*');
  window.EJS_player = '#game';
  window.EJS_core = kind==='gba' ? 'mgba' : 'gambatte';   // Kern immer aus dem Dateiinhalt
  window.EJS_gameUrl = file;
  window.EJS_gameName = name.replace(/\.[^.]+$/, '');
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  window.EJS_disableDatabases = true;   // keine Kopien von Spiel/Kern in IndexedDB
  window.EJS_threads = false;
  window.EJS_webgl2Enabled = false;      // WebGL2 auf iOS instabil -> einfacher Modus
  window.EJS_defaultOptions_extra = {'webgl2Enabled':'disabled','shader':'disabled','rewindEnabled':'disabled','save-state-location':'browser'};
  window.EJS_backgroundColor = '#000';
  window.EJS_defaultOptions = kind==='gba' ? {'mgba_skip_bios':'ON','mgba_interframe_blending':'mix'}
    : Object.assign({'gambatte_gb_colorization':'internal','gambatte_gb_internal_palette':'GB - DMG','gambatte_mix_frames':'mix'},
        (P.__rom.coreOpts && !P.__rom.coreOpts.mgba_skip_bios) ? P.__rom.coreOpts : {});
  Object.assign(window.EJS_defaultOptions, window.EJS_defaultOptions_extra);
  window.EJS_onGameStart = () => { pl('Spiel gestartet'); P.postMessage({ t: 'started' }, '*'); };
  window.EJS_ready = () => pl('Kern bereit ('+window.EJS_core+')');
  const s = document.createElement('script');
  s.src = window.EJS_pathtodata + 'loader.js';
  s.onerror = () => pl('loader.js nicht ladbar');
  document.body.appendChild(s);
  pl('lade Kern '+window.EJS_core);
})();
</script>
</body></html>
